[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wemust-mcp"
version = "0.1.0"
description = "Read-only MCP server for MUST WeMust and Moodle (unofficial, optional PDF support)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Knighty KAKA" }]
keywords = ["mcp", "wemust", "must", "timetable", "student"]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<8"]
pdf-images = ["PyMuPDF>=1.24.3,<2; python_version >= '3.10'"]

[project.scripts]
wemust-mcp = "wemust.mcp_server:main"
wemust = "wemust.cli:main"

[tool.setuptools]
packages = ["wemust"]
license-files = ["LICENSE"]
